; ============================================================
;  Plantilla de configuración de monitor_pc
;  Copia este archivo como  config.ini  y complétalo.
;  NUNCA subas config.ini al repositorio (ver .gitignore / spec §9).
; ============================================================

[smtp]
; Servidor SMTP genérico para el envío del reporte diario (spec §6)
host = smtp.gmail.com
port = 587
use_tls = true
user = tu_correo@gmail.com
; Para Gmail/Outlook usa una "contraseña de aplicación", no la contraseña normal.
password = APP_PASSWORD_AQUI

[report]
; Destinatario(s) del reporte, separados por coma
recipients = padre@example.com
; Nombre que aparece como remitente
sender_name = Reporte de actividad
; Generar y adjuntar tambien el Excel (.xlsx) ademas del cuerpo HTML
attach_excel = true
; Zona horaria para MOSTRAR las horas en el reporte (interno siempre es UTC, spec §4)
display_timezone = America/Lima
; Hora local a la que se intenta enviar el resumen del dia (HH:MM, 24h)
daily_send_time = 21:00

[monitoring]
; Usuario de Windows del menor que se monitorea (nombre de cuenta local)
target_user =
; SID del usuario (se resuelve en la instalacion; usado para %LOCALAPPDATA% y $Recycle.Bin)
target_sid =
; Intervalo del poll de procesos, en segundos (spec §3.1)
process_poll_seconds = 15
; Intervalo del bucle que evalua si toca enviar/consolidar el reporte, en segundos (spec §7)
report_check_seconds = 1800
; Carpetas (relativas al perfil del menor) a vigilar con watchdog para descargas (spec §3.3)
watch_folders = Downloads, Desktop, Documents

[categorization]
; Rutas locales a las hostlists publicas ya descargadas (spec §3.2). Vacio = usar solo heuristica.
adult_hostlist =
games_hostlist =
; Extensiones marcadas como sospechosas si vienen de dominios no confiables (spec §3.3)
suspicious_extensions = .apk, .exe, .zip

[storage]
; Archivo de estado local para reconstruir el reporte si el script se reinicia (spec §7)
state_db = state/monitor_state.db
; Carpeta donde se dejan los reportes generados (ignorada por git)
reports_dir = reports
